<!doctype html><html><head><meta charset="utf-8"><title>Atmosphere In Game</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1b18;--card:#fff;--line:#ddd6c8}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--fg:#ece7dc;--card:#211f19;--line:#3a362c}}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif;margin:0;padding:24px 16px}
main{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
figure img{display:block;width:100%;image-rendering:pixelated}
figcaption{padding:10px 12px;font-weight:600}
</style></head><body><main>
<figure><img src="hour-at-60x.gif" alt="An hour in the game, 60x"><figcaption>An hour in the game, 60x</figcaption></figure>
<figure><img src="lumbridge-day.png" alt="Lumbridge - day"><figcaption>Lumbridge - day</figcaption></figure>
<figure><img src="lumbridge-dusk.png" alt="Lumbridge - dusk"><figcaption>Lumbridge - dusk</figcaption></figure>
<figure><img src="lumbridge-night.png" alt="Lumbridge - night"><figcaption>Lumbridge - night</figcaption></figure>
<figure><img src="barbarian-day.png" alt="Barbarian Village - day"><figcaption>Barbarian Village - day</figcaption></figure>
<figure><img src="barbarian-night.png" alt="Barbarian Village - night"><figcaption>Barbarian Village - night</figcaption></figure>
<figure><img src="varrock-day.png" alt="Varrock, by Aubury's - day"><figcaption>Varrock, by Aubury's - day</figcaption></figure>
<figure><img src="varrock-night.png" alt="Varrock, by Aubury's - night"><figcaption>Varrock, by Aubury's - night</figcaption></figure>
<figure><img src="wilderness-day.png" alt="Wilderness - world day"><figcaption>Wilderness - world day</figcaption></figure>
<figure><img src="wildcamp-night.png" alt="Wilderness camp - night"><figcaption>Wilderness camp - night</figcaption></figure>
<figure><img src="bar-day.png" alt="Wilderness Bar - day"><figcaption>Wilderness Bar - day</figcaption></figure>
<figure><img src="bar-night.png" alt="Wilderness Bar - night"><figcaption>Wilderness Bar - night</figcaption></figure>
<figure><img src="lava-day.png" alt="Lava river - day"><figcaption>Lava river - day</figcaption></figure>
<figure><img src="lava-night.png" alt="Lava river - night"><figcaption>Lava river - night</figcaption></figure>
<figure><img src="mine-night.png" alt="Dwarven Mine - night"><figcaption>Dwarven Mine - night</figcaption></figure>
</main></body></html>
