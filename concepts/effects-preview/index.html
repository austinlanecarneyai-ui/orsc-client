<!doctype html><html><head><meta charset="utf-8"><title>Atmosphere Mockups</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1b18;--muted:#6b665d;--card:#fff;--line:#ddd6c8;--accent:#8a5a14}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--fg:#ece7dc;--muted:#a39d90;--card:#211f19;--line:#3a362c;--accent:#e0a54a}}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif;margin:0;padding:24px 16px}
main{max-width:1120px;margin:0 auto}h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:32px 0 10px;color:var(--accent)}
p.lede{color:var(--muted);max-width:760px}
.grid{margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
figure img{display:block;width:100%;image-rendering:pixelated}
figcaption{padding:10px 12px}figcaption b{display:block}figcaption span{color:var(--muted);font-size:13.5px}
</style></head><body><main>
