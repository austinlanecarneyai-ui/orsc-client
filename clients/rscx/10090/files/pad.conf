# Xbox controller settings for the ORSC client.
#
# Delete this file and everything below returns to its default. Nothing here
# needs a rebuild - the client reads it at startup, so change a line and
# relaunch.
#
# If a line is wrong the client says so in its console and keeps the default,
# rather than leaving a button doing nothing. Unknown button names are listed
# back at you with the valid ones.

# ---------------------------------------------------------------- buttons
#
# Valid names: Up Down Left Right Start Back LS RS LB RB A B X Y
#
# act      the default action - what a left click does
# options  the full option list - what a right click shows
# back     close a list, back out of a chooser
# retreat  PRESS this during a fight to break off. Only a press out in the
#          world: when a list is open, or a spell is armed, B closes that
#          instead, and never also ends the fight. The stick does nothing
#          in a fight, so leaning on it can never retreat you by accident
# target.next   RB. The nearest thing worth acting on, then the second
#          nearest, then the third. Skips anything you have no use for: a
#          rock with no pickaxe in the bag, a tree with no axe, a furnace
#          with nothing to smelt
# target.prev   LB. Steps through EVERYTHING on screen instead, including the
#          treestumps and ferns RB refuses to offer. The way to reach the
#          thing the pad has decided you do not want
# panel    open the inventory from the world, and close any panel back to it
# teleport open the teleport list
#
# Both bumpers also swap sides in the bank, trade and duel screens.
#
# The triggers do two jobs, decided by whether a panel is open:
#   panel open  ->  LT and RT page along the tab bar
#   in the world ->  LT turns auto-targeting off and on
#                    RT locks the target, and the box round it turns RED
#
# You should not often need either. Auto-targeting keeps the highlight on the
# nearest thing worth acting on by itself, and hands it over when that thing
# walks off. The lock is for when it is right and you want it to stay right -
# a lock survives anything wandering closer, and lets go on its own when the
# target dies, is picked up, or ends up more than ten tiles away.

act = A
options = Y
back = B

# Accept a trade or a duel, on both the offer screen and the confirm screen
# that follows it. Kept off the act button on purpose: agreeing to a deal
# should not be one frame away from putting an item into it.
confirm = X
retreat = B
target.next = RB
target.prev = LB
panel = Back
teleport = Start

# ------------------------------------------------------------ quick slots
#
# The D-pad, out in the world, does one thing in one press: casts a spell,
# toggles a prayer, eats a piece of food, or wields a weapon.
#
# You do not have to edit these by hand, and there are two ways in:
#
#   A SPELL OR A PRAYER.  Open the magic tab (Select, then LT until you reach
#   it), press LB or RB to turn to the prayers if you want one, put the
#   highlight on what you want and press X.
#
#   FOOD OR A WEAPON.  Open your inventory, put the highlight on the item and
#   press Y for the option list. Choose "Bind to D-pad". Once it is bound the
#   same row reads "Clear D-pad", so one entry both binds and unbinds.
#
# Either way you then pick an arm of the D-pad and press A, and each arm shows
# what it is already holding so overwriting one is a decision rather than an
# accident. It is written back here, so it is still bound tomorrow.
#
# Pressing Y on an item and pressing A on it are not the same thing and never
# become the same thing: A still performs the item's own action, so A on a
# lobster eats the lobster. The binding row deliberately sits further down the
# list.
#
# WHAT A SLOT MAY HOLD
#
#   a prayer      Superhuman strength
#   a spell       Wind strike
#   food          eat:Lobster
#   a weapon      wield:Rune long sword
#   a bow + ammo  bow:Oak Longbow
#
# Name spells and prayers exactly as the game does. Items carry a prefix, and
# it is the same prefix the keyboard's key.f1..key.f9 slots use - so
# `quick.up = eat:Shark` and `key.f1 = eat:Shark` mean exactly the same thing,
# and moving a binding from one to the other needs no second spelling.
#
# An item name must match exactly, ignoring case: `eat:Shark` will not find a
# Sharks fin. That is deliberate - the cost of a loose match is eating the
# wrong thing in a fight. An item you are not carrying does nothing at all
# when its arm is pressed, and says nothing, because the bag is searched at the
# moment you press rather than at login.
#
# Spelling is checked at startup for spells and prayers, and anything
# unrecognised is reported in the console with the nearest matches. Item names
# are NOT checked at startup, for the reason above.
#
# Leave a slot blank to disable it. Empty by default, deliberately: a slot that
# came pre-filled would fire a spell you did not choose, at whatever you were
# pointing at, and charge you the runes for it.
#
# In a fight these are the whole point - switching a prayer, putting a spell
# back on target, or eating without opening a panel, is one press rather than a
# trip through two tabs.

# Examples, if you want somewhere to start. Delete the # to use one.
#
#   quick.up = Superhuman strength
#   quick.down = eat:Lobster
#   quick.left = Wind strike
#   quick.right = wield:Rune long sword

quick.up =
quick.down =
quick.left =
quick.right =

# ------------------------------------------------------------------ feel
#
# deadzone.left / deadzone.right
#   How far a stick must move before it counts, 0..32000. These are the
#   figures Microsoft recommends. Raise them if a resting stick drifts;
#   lower them if small movements are being ignored.
#
# camera.sensitivity
#   0.1 to 5.0. How fast the right stick turns the camera.
#
# reach
#   1 to 10. How many tiles ahead a full stick push aims. Higher feels more
#   committed and covers ground faster; lower turns more sharply. This does
#   NOT change how fast you walk - the server decides that, and nothing here
#   can make a character move faster than the game allows.

# How long a server tick is, in milliseconds. This is NOT a feel setting: the
# server resets your action state on every walk packet it accepts, so a pad
# that sends them faster than the server ticks cancels whatever you were
# doing. It has to match the server's game_tick, and the server never tells
# the client what that is.
#
# Do not set this by hand. mod\tools\Game-Speed.cmd sets this and the
# server together, which is the only safe way to change either.
tick.ms = 492

deadzone.left = 7849
deadzone.right = 8689
camera.sensitivity = 1.0
reach = 5

# ------------------------------------------------------------------ extras
#
# hints   the button strip along the bottom. Worth leaving on until the
#         controls are second nature, then turn it off for the screen space.
# rumble  the controller speaks. A blow lands in your left hand, a gem or a
#         spell in your right; mining knocks, the anvil strikes twice, a
#         level-up rises. On by default since 2026-09-06. There is a switch
#         in Settings > General, so you need not edit this to stop it.

# Keep a spell armed after casting it, so it can be cast again without walking
# back to the magic tab. The stock client drops the spell after every cast,
# which is fine with a mouse - the cursor changes back and you can see it - but
# on a pad the magic tab is five trigger presses away and a spell you have to
# re-arm between every cast is a spell you do not use in a fight.
#
# It stops on its own when you press B, and when you run out of runes: the
# re-arm goes through the client's own checks exactly as the first one did, so
# the client refuses it and says why. Set false for the stock behaviour.
autocast = true

hints = true
rumble = true

controller = on

# Carried over from the folder this build replaced. These were
# set here and are not in the source pad.conf, so a plain copy
# would have silently thrown them away.
show.readouts = on
